{% macro status_badge(status, classes='') %}
{%- set colours = {
'Open': 'success',
'Sold Out': 'danger',
'Inactive': 'secondary',
'Cancelled': 'dark'
} -%}
<span class="badge rounded-pill text-bg-{{ colours.get(status, 'secondary') }} {{ classes }}">
    {{ status | upper }}
</span>
{%- endmacro %}
