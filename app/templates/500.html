{% extends "base.html" %}
{% from "macros.html" import status_badge %}

{% block title %}500 Internal Server Error | Feastly{% endblock %}

{% block content %}
<section class="booking-history-heading py-4 py-lg-5">
    <div class="container-xl">
        <div class="row">
            <div class="col-lg-8">
                <h1 class="display-5 fw-bold mt-2 mb-3">500 Internal Server Error</h1>
                <p id="redirectMessage">Redirecting to Main Page in 8 seconds...</p>
                <script>
                    var seconds = 8;
                    var url = "{{ url_for('main.index') }}";

                    function redirect() {
                        if (seconds <= 0) {
                            window.location = url;
                        } else {
                            seconds--;
                            document.getElementById("redirectMessage").innerHTML = "Redirecting to Main Page after " + seconds + " seconds...";
                            setTimeout(redirect, 1000);
                        }
                    }
                    window.onload = redirect;
                </script>
            </div>
        </div>
    </div>
</section>
{% endblock content %}
